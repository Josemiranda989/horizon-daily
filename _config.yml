theme: jekyll-theme-cayman
title: Horizon Diario
description: Resumen diario de noticias tech, AI y self-hosting — curado por IA
baseurl: ""
url: "https://daily.jmlabs.app"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
